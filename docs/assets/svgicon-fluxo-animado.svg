<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de renderização dos ícones</title>
  <desc id="desc">Diagrama animado que conecta o SVG ou a URL ao registro de ícones, à lista de ferramentas, ao ToolCard e ao SvgIcon.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .surface { fill: #fdfdfb; stroke: #dce6e9; stroke-width: 1.5; }
      .eyebrow { fill: #627887; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .label { fill: #133345; font-size: 15px; font-weight: 700; }
      .detail { fill: #627887; font-size: 11px; }
      .node { transform-box: fill-box; transform-origin: center; animation: settle 4s ease-in-out infinite; }
      .n2 { animation-delay: .25s; }
      .n3 { animation-delay: .5s; }
      .n4 { animation-delay: .75s; }
      .n5 { animation-delay: 1s; }
      .route { fill: none; stroke: #e66f58; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 5 8; animation: travel 1.8s linear infinite; }
      .dot { fill: #e66f58; }
      @keyframes travel { to { stroke-dashoffset: -52; } }
      @keyframes settle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        .node { animation: none; }
        .route { animation: none; }
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e66f58"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="330" rx="20" fill="#f2f6f7"/>
  <text x="36" y="34" class="eyebrow">HAUY CONECTA · COMO UM ÍCONE CHEGA AO CARD</text>
  <text x="36" y="58" fill="#133345" font-size="20" font-weight="700">Do registro à tela</text>

  <path class="route" d="M198 166 H226" marker-end="url(#arrow)"/>
  <path class="route" d="M402 166 H430" marker-end="url(#arrow)"/>
  <path class="route" d="M606 166 H634" marker-end="url(#arrow)"/>
  <path class="route" d="M810 166 H838" marker-end="url(#arrow)"/>

  <g class="node n1" transform="translate(28 105)">
    <rect class="surface" width="170" height="122" rx="14"/>
    <rect x="15" y="16" width="40" height="40" rx="10" fill="#dce6e9"/>
    <path d="M25 28h20v17H25z M29 24h12 M29 49h12" fill="none" stroke="#133345" stroke-width="2" stroke-linecap="round"/>
    <text x="15" y="78" class="eyebrow">ENTRADA</text>
    <text x="15" y="96" class="label">SVG ou URL</text>
    <text x="15" y="112" class="detail">O desenho original</text>
  </g>
  <g class="node n2" transform="translate(232 105)">
    <rect class="surface" width="170" height="122" rx="14"/>
    <rect x="15" y="16" width="40" height="40" rx="10" fill="#e1f2f7"/>
    <path d="M24 27h22v18H24z M29 22h12 M29 50h12" fill="none" stroke="#27638a" stroke-width="2" stroke-linejoin="round"/>
    <text x="15" y="78" class="eyebrow">REGISTRO</text>
    <text x="15" y="96" class="label">Icon maps</text>
    <text x="15" y="112" class="detail">Organiza por ID</text>
  </g>
  <g class="node n3" transform="translate(436 105)">
    <rect class="surface" width="170" height="122" rx="14"/>
    <rect x="15" y="16" width="40" height="40" rx="10" fill="#ffe5e0"/>
    <path d="M25 25h20v24H25z M30 31h10 M30 36h10 M30 41h7" fill="none" stroke="#b84f3d" stroke-width="2" stroke-linecap="round"/>
    <text x="15" y="78" class="eyebrow">CATÁLOGO</text>
    <text x="15" y="96" class="label">tools.js</text>
    <text x="15" y="112" class="detail">Liga dados e ícone</text>
  </g>
  <g class="node n4" transform="translate(640 105)">
    <rect class="surface" width="170" height="122" rx="14"/>
    <rect x="15" y="16" width="40" height="40" rx="10" fill="#dce6e9"/>
    <rect x="23" y="24" width="24" height="25" rx="3" fill="none" stroke="#133345" stroke-width="2"/>
    <path d="M27 30h16 M27 35h16 M27 40h11" stroke="#133345" stroke-width="2" stroke-linecap="round"/>
    <text x="15" y="78" class="eyebrow">INTERFACE</text>
    <text x="15" y="96" class="label">ToolCard</text>
    <text x="15" y="112" class="detail">Monta o cartão</text>
  </g>
  <g class="node n5" transform="translate(844 105)">
    <rect class="surface" width="208" height="122" rx="14"/>
    <rect x="15" y="16" width="40" height="40" rx="10" fill="#e5f5d2"/>
    <circle cx="35" cy="36" r="12" fill="none" stroke="#5f8c30" stroke-width="2"/>
    <path d="M27 36l5 5 11-11" fill="none" stroke="#5f8c30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="78" class="eyebrow">RENDERIZAÇÃO</text>
    <text x="15" y="96" class="label">SvgIcon</text>
    <text x="15" y="112" class="detail">Decide como exibir</text>
  </g>
  <text x="36" y="278" fill="#627887" font-size="12">O registro escolhe o ícone. O catálogo escolhe a ferramenta. O componente mostra o desenho.</text>
  <circle class="dot" cx="1030" cy="278" r="4"/>
  <text x="1042" y="282" fill="#627887" font-size="11" text-anchor="end">fluxo animado</text>
</svg>
