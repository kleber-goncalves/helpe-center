name: Validate Hauy Conecta

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "dist/**"
      - "public/sitemap.xml"
      - "docs/AI_CONTEXT.md"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "dist/**"
      - "public/sitemap.xml"
      - "docs/AI_CONTEXT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}-${{ github.actor == 'github-actions[bot]' && 'automation' || 'code' }}
  # Execuções do bot usam grupo próprio e não disputam a validação de código.
  cancel-in-progress: false

jobs:
  validate:
    name: Tests, lint and production build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:search

      - name: Run PWA unit tests
        run: npm run test:pwa:unit

      - name: Run ESLint
        run: npm run lint

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build, prerender and audit images
        run: npm run build

      - name: Run PWA browser tests
        run: npm run test:pwa:e2e
