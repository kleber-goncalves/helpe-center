name: Validate ferramentas branch

concurrency:
  group: validate-feat-ferramentas
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/ferramentas
    paths-ignore:
      - "dist/**"
      - "public/sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Search unit tests
        run: npm run test:search

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build and prerender
        run: npm run build
