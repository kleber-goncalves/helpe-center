name: Build prerendered site

concurrency:
  group: prerender-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/pwa
    paths-ignore:
      - "dist/**"
      - "public/sitemap.xml"
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build

      - name: Remove generated route list
        run: rm -f prerender-routes.json

      - name: Commit generated dist and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes in dist or sitemap."
            exit 0
          fi
          git commit -m "build: update prerendered site"

          # A sincronização do AI_CONTEXT pode avançar a branch durante a build.
          # Rebaseia o artefato gerado sobre o HEAD remoto antes de publicar.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
