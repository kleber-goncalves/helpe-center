name: Sync PWA Phase 1 metadata

on:
  push:
    branches:
      - feat/pwa
    paths:
      - "package.json"
      - "src/pwa/**"
      - "tests/pwa/**"
      - "scripts/sync-pwa-phase1-docs.mjs"
      - ".github/workflows/sync-pwa-phase1.yml"

permissions:
  contents: write

concurrency:
  group: sync-pwa-phase1
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/pwa
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate lockfile with project npm version
        run: npx --yes npm@10.9.0 install --package-lock-only --ignore-scripts

      - name: Synchronize PWA documentation
        run: node scripts/sync-pwa-phase1-docs.mjs

      - name: Commit generated lockfile and documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json docs/AI_CONTEXT.md docs/arquitetura-pwa-hauy-conecta.md
          git rm --ignore-unmatch scripts/sync-pwa-phase1-docs.mjs .github/workflows/sync-pwa-phase1.yml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
            exit 0
          fi

          git commit -m "chore(pwa): sincronizar lockfile e documentação"

          for attempt in 1 2 3; do
            git fetch origin feat/pwa
            git rebase origin/feat/pwa
            if git push origin HEAD:refs/heads/feat/pwa; then
              exit 0
            fi
            sleep 2
          done

          echo "Não foi possível publicar o commit de sincronização."
          exit 1
