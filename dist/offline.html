<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B4532D" />
    <title>Sem conexão — Hauy Conecta</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Source Sans 3", Arial, sans-serif;
        background: #fffdf9;
        color: #26231f;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #ded7cc;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 18px 50px rgb(38 35 31 / 8%);
      }
      .mark {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 20px;
        background: #b4532d;
        color: white;
        font-size: 30px;
        font-weight: 800;
      }
      h1 {
        margin: 0;
        font-family: "Nunito", Arial, sans-serif;
        font-size: clamp(24px, 6vw, 32px);
      }
      p {
        margin: 12px 0 24px;
        color: #6b6861;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #d35400;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #26231f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">H</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível carregar o conteúdo solicitado. Verifique sua
        conexão e tente novamente. O conteúdo básico já armazenado pode
        continuar disponível.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
